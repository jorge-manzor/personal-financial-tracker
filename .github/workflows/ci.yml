name: CI

on:
  # pull_request ya dispara en cada push a una rama con PR abierto
  # (opened/synchronize/reopened), sin necesidad de un trigger `push` aparte.
  pull_request:
    branches: [main]
  # Permite re-ejecutar desde la pestaña Actions → Run workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-smoke:
    name: backend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Import app
        run: python -c "import main; print(main.app.title)"
      - name: Unit + smoke tests
        run: python -m pytest -q tests/
        env:
          PYTHONPATH: .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck + build
        run: npm run build
